      properties:
        startOffset:
          type: integer
          minimum: 0
        endOffset:
          type: integer
          minimum: 1

    EsClaim:
      type: object
      required: [id, sentence, text, type, status, evidence]
      properties:
        id:
          type: string
          format: uuid
        sentence:
          type: string
        text:
          type: string
        type:
          $ref: '#/components/schemas/ClaimType'
        status:
          $ref: '#/components/schemas/ClaimStatus'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ClaimEvidence'
        explanation:
          type: string
        targetRange:
          $ref: '#/components/schemas/TextRange'

    EsIssueCode:
      type: string
      enum:
        - QUESTION_NOT_ANSWERED
        - UNSUPPORTED_PERSONAL_FACT
        - UNSUPPORTED_COMPANY_FACT
        - CONTRADICTION
        - ABSTRACT_EXPRESSION
        - REDUNDANT_EXPRESSION
        - CHARACTER_LIMIT_EXCEEDED
        - CHARACTER_LIMIT_UNDERUSED
        - VOICE_DEVIATION

    EsIssue:
      type: object
      required: [code, severity, message]
      properties:
        code:
          $ref: '#/components/schemas/EsIssueCode'
        severity:
          type: string
          enum: [ERROR, WARNING, INFO]
        message:
          type: string
        sentence:
          type: string
        targetRange:
          $ref: '#/components/schemas/TextRange'
        relatedClaimIds:
          type: array
          items:
            type: string
            format: uuid

    SubmissionReadiness:
      type: string
      enum: [READY_TO_SUBMIT, NEEDS_REVIEW]
      description: 設問回答、文字数、全主張の根拠を決定的に検査した結果。数値点数ではない。

    EsAiComment:
      type: object
      required: [category, message, severity, evidence]
      properties:
        category:
          type: string
          enum: [EVIDENCE_STATUS, ISSUE, IMPROVEMENT_REASON]
        message:
          type: string
          maxLength: 2000
        severity:
          type: string
          enum: [ERROR, WARNING, INFO]
        targetRange:
          $ref: '#/components/schemas/TextRange'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ClaimEvidence'

    EsAnalysis:
      type: object
      required:
        - id
        - esDocumentId
        - sourceKind
        - freshness
        - characterCount
        - withinCharacterLimit
        - questionCoverage
        - submissionReadiness
        - claims
        - issues
        - comments
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        esDocumentId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        sourceKind:
          type: string
          enum: [ORIGINAL, REVISION]
        freshness:
          $ref: '#/components/schemas/ResultFreshness'
        characterCount:
          type: integer
          minimum: 0
          description: Unicodeコードポイント数。CRLFはLFへ正規化し、改行・空白も1文字として数える。
        withinCharacterLimit:
          type: boolean
        questionCoverage:
          type: string
          enum: [ANSWERED, PARTIALLY_ANSWERED, NOT_ANSWERED]
        submissionReadiness:
          $ref: '#/components/schemas/SubmissionReadiness'
        claims:
          type: array
          items:
            $ref: '#/components/schemas/EsClaim'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/EsIssue'
        comments:
          type: array
          description: 完成版ESの下へ、根拠状態・問題箇所・改善理由として表示するAIコメント。
          items:
            $ref: '#/components/schemas/EsAiComment'
        createdAt:
          type: string
          format: date-time

    CreateEsRevisionRequest:
      type: object
      properties:
        emphasis:
          type: array
          items:
            type: string
        preserveExpressions:
          type: array
          description: 必ず残したい本人の表現。
          items:
            type: string

    RevisionDecision:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED]

    RevisionChange:
      type: object
      required: [id, before, after, reason, evidence, decision]
      properties:
        id:
          type: string
          format: uuid
        before:
          type: string
        after:
          type: string
        reason:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ClaimEvidence'
        decision:
          $ref: '#/components/schemas/RevisionDecision'

    EsRevision:
      type: object
      required:
        - id
        - esDocumentId
        - freshness
        - revisedText
        - usedExperienceIds
        - usedSessionReportIds
        - characterCount
        - changes
        - unsupportedClaims
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        esDocumentId:
          type: string
          format: uuid
        basedOnAnalysisId:
          type: string
          format: uuid
        freshness:
          $ref: '#/components/schemas/ResultFreshness'
        revisedText:
          type: string
          description: 提出可能品質を目標に生成した完成版ES案。verify完了前は提出可能と断定しない。
        usedExperienceIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        usedSessionReportIds:
          type: array
          uniqueItems: true
          description: 表現方針の参考にしたセッション結果。本人事実の証明には使わない。
          items:
            type: string
            format: uuid
        characterCount:
          type: integer
          minimum: 0
        changes:
          type: array
          items:
            $ref: '#/components/schemas/RevisionChange'
        unsupportedClaims:
          type: array
          items:
            $ref: '#/components/schemas/EsClaim'
        verificationAnalysisId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        reason:
          type: string
        metadata:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [requestId, code, message, retryable, details]
      properties:
        requestId:
          type: string
          format: uuid
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - CONFLICT
            - AI_UNAVAILABLE
            - AI_TIMEOUT
            - AI_INVALID_OUTPUT
            - UNSAFE_URL
            - FETCH_FAILED
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - INTERNAL_ERROR
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
