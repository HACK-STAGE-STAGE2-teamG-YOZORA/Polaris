openapi: 3.1.0
info:
  title: Polaris API
  version: 0.3.0
  summary: 根拠付き自己分析とES推敲を行うローカルWebアプリのAPI契約
  description: |
    Polaris MVPのフロントエンドとバックエンド間の契約。

    - 単一ユーザー・localhost運用を前提とし、認証は行わない。
    - AIが生成した経験・4軸分析は、ユーザーが確認するまで確定情報として扱わない。
    - 4軸は強制二択にせず、両方・状況依存・根拠不足を正式な結果として扱う。
    - 完了チャット1件につき自己分析結果を1件保存し、ホームとESでは全完了セッションを再利用する。
    - ホームは過去結果一覧ではなく、全履歴から再計算した4軸、強み、弱み・注意点を表示する。
    - P0は単一デモユーザーとし、GoogleログインはP1で実装する。
    - ESの事実根拠には、確認済み経験と登録済み企業公式情報だけを使用する。
    - `x-priority`がない操作はP0。`P1`・`P2`付き操作はP0完成後の拡張契約とする。
    - APIの日時はISO 8601 UTC、IDはUUID、JSONはUTF-8とする。
  contact:
    name: Polaris development team
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:3000
    description: ローカル開発・デモ環境
security: []
tags:
  - name: System
    description: アプリ、DB、LM Studioの稼働状態
  - name: Dashboard
    description: ホーム画面の進行中セッション、全履歴からの総合自己分析、ES要約
  - name: Self Analysis
    description: 自己分析セッション、チャット、セッション固有4軸、セッションレポート
  - name: Experiences
    description: ユーザーが確認する経験カード
  - name: Axis Assessments
    description: Focus↔Connect、Plan↔Experiment、Mastery↔Impact、Stable↔Dynamicの4軸分析
  - name: Companies
    description: 応募企業と根拠付き企業情報
  - name: Recommendations
    description: 登録済み候補企業の公式情報を取得して行う根拠付き提案
  - name: ES
    description: ES文書、検査、推敲、再検査

paths:
  /api/v1/system/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: アプリの稼働状態を取得する
      responses:
        '200':
          description: 稼働状態。依存先の一部が停止していてもレスポンス自体は返す。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/system/lm-studio:
    get:
      tags: [System]
      operationId: getLmStudioStatus
      summary: LM Studioとの接続状態を取得する
      responses:
        '200':
          description: 接続確認結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LmStudioStatus'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: ホーム画面に必要な状態をまとめて取得する
      description: 進行中セッション、全履歴からの総合プロフィール、保存済みES要約を返す。過去セッション結果一覧は返さない。
      responses:
        '200':
          description: ホーム表示用データ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/overall-self-analysis/recompute:
    post:
      tags: [Dashboard]
      operationId: recomputeOverallSelfAnalysis
      summary: 全完了セッションからホーム用総合プロフィールを再計算する
      description: |
        全セッションレポート、全確認済み経験、正式根拠、本人評価を再集計する。
        セッションの軸位置を数値化して平均せず、全根拠から4軸、強み、弱み・注意点を生成する。
        完了セッションが2件未満または確認済み経験が3件未満でも生成し、`isDataSparse=true`を返す。
      responses:
        '200':
          description: 再計算した総合プロフィール
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverallSelfAnalysisProfile'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/analysis-sessions:
    get:
      tags: [Self Analysis]
      operationId: listAnalysisSessions
      summary: 自己分析セッション一覧を取得する
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AnalysisSessionStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: セッション一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSessionPage'
    post:
      tags: [Self Analysis]
      operationId: createAnalysisSession
      summary: 自己分析セッションを開始する
      description: |
        `START_NEW`は進行中セッションがある場合に409を返す。
        `RESTART_ACTIVE`は進行中セッションをABANDONEDにしてから新規セッションを作る。
        完了済みレポートと確認済み経験は削除しない。
        過去の確認済み経験は新セッション固有の4軸分析へ含めないが、ホーム総合プロフィールとES生成には使用する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisSessionRequest'
      responses:
        '201':
          description: 作成したセッション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSession'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/analysis-sessions/current:
    get:
      tags: [Self Analysis]
      operationId: getCurrentAnalysisSession
      summary: 「続きから」に使用する進行中セッションを取得する
      responses:
        '200':
          description: 進行中セッション。存在しない場合は`session=null`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAnalysisSessionResponse'

  /api/v1/analysis-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Self Analysis]
      operationId: getAnalysisSession
      summary: 自己分析セッションを取得する
      responses:
        '200':
          description: セッション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSession'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/analysis-sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Self Analysis]
      operationId: listAnalysisMessages
      summary: セッションの会話履歴を取得する
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: メッセージ一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Self Analysis]
      operationId: sendAnalysisMessage
      summary: ユーザーの回答を送り、AIの次の質問を取得する
      description: |
        AIは一度に一つの質問だけを返す。応答中に抽出した根拠候補は
        `evidenceCandidates`として返すが、この時点では未確認情報である。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: 1往復分の会話と抽出結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatTurnResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/analysis-sessions/{sessionId}/experience-drafts:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Self Analysis]
      operationId: createExperienceDraft
      summary: 会話から経験カード案を作成する
      description: 作成結果は必ず`DRAFT`であり、ユーザー確認後に`CONFIRMED`へ変更する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperienceDraftRequest'
      responses:
        '201':
          description: 経験カード案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/analysis-sessions/{sessionId}/axis-assessments/generate:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Self Analysis]
      operationId: generateAxisAssessments
      summary: 対象チャットからセッション固有の独自4軸分析を生成または更新する
      description: |
        対象セッションで確認した経験だけを使い、未確認経験と過去セッションの経験は根拠として使用しない。
        USERメッセージが1件以上あれば、確認済み経験が0件でも生成する。根拠がない軸はINSUFFICIENT_EVIDENCEとする。
        各軸最大1件をセッション単位で更新する。
        AI候補を検証し、最終positionとstatusはTypeScriptのドメイン規則で決定する。
      responses:
        '200':
          description: 生成・更新した4軸分析
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AxisAssessment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/analysis-sessions/{sessionId}/finalize:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Self Analysis]
      operationId: finalizeAnalysisSession
      summary: 自己分析を完了し、4軸の自己分析レポートを作成する
      description: |
        終了確認後に呼ぶ。USERメッセージ1件以上、4軸分析、4軸すべての本人評価を必要とする。
        `UNREVIEWED`の軸が一つでもある場合は409を返す。
        確認済み経験が0件でも完了できるが、根拠のない軸はINSUFFICIENT_EVIDENCEとする。
        同一セッションへ作成できるレポートは1件だけである。
      responses:
        '200':
          description: 自己分析レポート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAnalysisReport'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/experiences:
    get:
      tags: [Experiences]
      operationId: listExperiences
      summary: 経験カード一覧を取得する
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ExperienceStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 経験カード一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperiencePage'
    post:
      tags: [Experiences]
      operationId: createExperience
      summary: フォーム入力から経験カードを作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperienceRequest'
      responses:
        '201':
          description: 作成した経験カード
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/experiences/{experienceId}:
    parameters:
      - $ref: '#/components/parameters/ExperienceId'
    get:
      tags: [Experiences]
      operationId: getExperience
      summary: 経験カードを取得する
      responses:
        '200':
          description: 経験カード
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Experiences]
      operationId: updateExperience
      summary: 経験カードを修正または確認する
      description: |
        `status=CONFIRMED`へ変更する場合、`title`、`situation`、`role`、`actions`の
        最低項目がそろっている必要がある。確認済みカードの内容を編集し、同じリクエストで
        `status=CONFIRMED`を明示しない場合は自動的に`DRAFT`へ戻す。どちらの場合も、
        関連する仮説とES検査結果を古い状態にする。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExperienceRequest'
      responses:
        '200':
          description: 更新した経験カード
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Experiences]
      operationId: deleteExperience
      summary: 経験カードを削除する
      description: 関連する仮説・ES根拠を削除せず、古い状態として再計算を要求する。
      responses:
        '204':
          description: 削除完了
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/axis-assessments:
    get:
      tags: [Axis Assessments]
      operationId: listAxisAssessments
      summary: 4軸分析一覧を取得する
      parameters:
        - name: axis
          in: query
          schema:
            $ref: '#/components/schemas/SelfAnalysisAxis'
        - name: sessionId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AxisAssessmentStatus'
      responses:
        '200':
          description: 4軸分析一覧
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AxisAssessment'

  /api/v1/axis-assessments/{axisAssessmentId}:
    parameters:
      - $ref: '#/components/parameters/AxisAssessmentId'
    patch:
      tags: [Axis Assessments]
      operationId: reviewAxisAssessment
      summary: 4軸分析に対する本人評価・修正文を保存する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewAxisAssessmentRequest'
      responses:
        '200':
          description: 更新した4軸分析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AxisAssessment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/self-analysis-reports:
    get:
      tags: [Self Analysis]
      operationId: listSelfAnalysisReports
      x-priority: P1
      summary: 最新を含む自己分析レポート履歴を取得する
      description: ホームでは使用しない。将来の履歴画面またはデバッグ用。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: レポート履歴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAnalysisReportPage'

  /api/v1/self-analysis-reports/latest:
    get:
      tags: [Self Analysis]
      operationId: getLatestSelfAnalysisReport
      x-priority: P1
      summary: 最新の自己分析レポートを取得する
      description: ホームでは使用せず、将来の履歴機能向けに保持する。
      responses:
        '200':
          description: 最新レポート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAnalysisReport'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/self-analysis-reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/ReportId'
    get:
      tags: [Self Analysis]
      operationId: getSelfAnalysisReport
      summary: 指定した自己分析レポートを取得する
      responses:
        '200':
          description: 自己分析レポート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfAnalysisReport'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/companies:
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: 登録企業一覧を取得する
      parameters:
        - name: recommendationEligible
          in: query
          description: 指定時は企業提案の候補可否で絞り込む。
          schema:
            type: boolean
      responses:
        '200':
          description: 企業一覧
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanySummary'
    post:
      tags: [Companies]
      operationId: createCompany
      summary: 応募企業を作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: 作成した企業
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      operationId: getCompany
      summary: 出典と事実を含む企業情報を取得する
      responses:
        '200':
          description: 企業情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Companies]
      operationId: updateCompany
      summary: 企業名・応募職種・メモを更新する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: 更新した企業
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Companies]
      operationId: deleteCompany
      summary: 企業情報を削除する
      responses:
        '204':
          description: 削除完了
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/companies/{companyId}/sources/text:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Companies]
      operationId: importCompanyText
      summary: 貼り付けた企業公式情報を構造化して登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCompanyTextRequest'
      responses:
        '201':
          description: 作成した出典と抽出事実
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyImportResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/companies/{companyId}/sources/url:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Companies]
      operationId: importCompanyUrl
      x-priority: P1
      summary: URLから企業公式情報を取得・構造化して登録する
      description: |
        `http`/`https`のみ許可し、localhost、プライベートIP、リンクローカルIP、
        メタデータサービス宛て通信、リダイレクト後の禁止宛先を拒否する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCompanyUrlRequest'
      responses:
        '201':
          description: 作成した出典と抽出事実
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyImportResult'
        '400':
          $ref: '#/components/responses/UnsafeUrl'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/companies/{companyId}/sources/file:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    post:
      tags: [Companies]
      operationId: importCompanyFile
      x-priority: P2
      summary: PDFまたはWordの企業公式資料を構造化して登録する
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, trustLevel]
              properties:
                file:
                  type: string
                  format: binary
                  description: 最大10MB。PDF、DOCX、TXTのみ。
                sourceUrl:
                  type: string
                  format: uri
                  description: 元資料の公開URL。分かる場合のみ指定する。
                trustLevel:
                  $ref: '#/components/schemas/SourceTrustLevel'
      responses:
        '201':
          description: 作成した出典と抽出事実
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyImportResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/company-recommendation-runs:
    post:
      tags: [Recommendations]
      operationId: createCompanyRecommendationRun
      x-priority: P1
      summary: 登録済み候補企業の公式情報を更新し、根拠付き企業提案を開始する
      description: |
        ローカルLLMの一般知識から任意企業を発見するAPIではない。候補は`candidateCompanyIds`、
        または`recommendationEligible=true`の登録企業に限定する。`refreshOfficialSources=true`の場合、
        各企業の`careerUrl`を優先し、なければ`officialUrl`をSSRF対策付きで取得してから比較する。
        複数URL取得とAI処理を行うため非同期実行とし、進捗はGETでポーリングする。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecommendationRunRequest'
      responses:
        '202':
          description: 受理した提案実行
          headers:
            Location:
              description: 実行状態を取得するURL
              schema:
                type: string
                example: /api/v1/company-recommendation-runs/0d42d9dd-7cc3-42bc-8bdb-67a991675d62
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationRun'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/company-recommendation-runs/{recommendationRunId}:
    parameters:
      - $ref: '#/components/parameters/RecommendationRunId'
    get:
      tags: [Recommendations]
      operationId: getCompanyRecommendationRun
      x-priority: P1
      summary: 企業提案の進捗と結果を取得する
      responses:
        '200':
          description: 実行状態。完了時は`recommendations`を含む。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationRun'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/es-documents:
    get:
      tags: [ES]
      operationId: listEsDocuments
      summary: ES文書一覧を取得する
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ES文書一覧
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EsDocumentSummary'
    post:
      tags: [ES]
      operationId: createEsDocument
      summary: ユーザーが作成したES原文を登録する
      description: |
        空の文章からの自動生成はMVP対象外。`originalText`は1文字以上必要。
        `companyId`は任意で、未指定時も本人経験に関する検査を実行できる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEsDocumentRequest'
      responses:
        '201':
          description: 作成したES文書
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/es-documents/{esDocumentId}:
    parameters:
      - $ref: '#/components/parameters/EsDocumentId'
    get:
      tags: [ES]
      operationId: getEsDocument
      summary: ES文書と最新検査・推敲を取得する
      responses:
        '200':
          description: ES文書
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsDocument'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ES]
      operationId: updateEsDocument
      summary: ES設問・原文・指定文字数などを更新する
      description: 更新すると既存の検査・推敲結果は`STALE`になる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEsDocumentRequest'
      responses:
        '200':
          description: 更新したES文書
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [ES]
      operationId: deleteEsDocument
      summary: ES文書と検査・推敲履歴を削除する
      responses:
        '204':
          description: 削除完了
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/es-documents/{esDocumentId}/analyses:
    parameters:
      - $ref: '#/components/parameters/EsDocumentId'
    post:
      tags: [ES]
      operationId: analyzeEsDocument
      summary: ES原文の主張・根拠・文字数・設問適合性を検査する
      description: 全確認済み経験・全セッション結果を候補として参照し、数値採点ではなく主張ごとの根拠状態、問題箇所、コメントを返す。
      responses:
        '201':
          description: 検査結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsAnalysis'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/es-documents/{esDocumentId}/revisions:
    parameters:
      - $ref: '#/components/parameters/EsDocumentId'
    post:
      tags: [ES]
      operationId: reviseEsDocument
      summary: 全履歴を候補に、提出可能品質を目標とした完成版ES案を作成する
      description: すべての経験を本文へ列挙せず、設問と文字数に最も合う確認済み経験を選ぶ。生成後はverifyが必要。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEsRevisionRequest'
      responses:
        '201':
          description: 推敲案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsRevision'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/es-revisions/{revisionId}/verify:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    post:
      tags: [ES]
      operationId: verifyEsRevision
      summary: 完成版ES案を原文と同じルールで再検査し、提出可否とAIコメントを作る
      responses:
        '201':
          description: 再検査結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsAnalysis'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/AiInvalidOutput'
        '503':
          $ref: '#/components/responses/AiUnavailable'
        '504':
          $ref: '#/components/responses/AiTimeout'

  /api/v1/es-revisions/{revisionId}/changes/{changeId}:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
      - $ref: '#/components/parameters/ChangeId'
    patch:
      tags: [ES]
      operationId: reviewEsRevisionChange
      x-priority: P1
      summary: 推敲変更を採用または却下する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  $ref: '#/components/schemas/RevisionDecision'
      responses:
        '200':
          description: 更新した変更項目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionChange'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExperienceId:
      name: experienceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AxisAssessmentId:
      name: axisAssessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EsDocumentId:
      name: esDocumentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChangeId:
      name: changeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecommendationRunId:
      name: recommendationRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: 前ページの`nextCursor`。省略時は先頭ページ。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ValidationError:
      description: 入力形式または業務ルール違反
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            requestId: 0d42d9dd-7cc3-42bc-8bdb-67a991675d62
            code: VALIDATION_ERROR
            message: 入力内容を確認してください。
            retryable: false
            details:
              - field: characterLimit
                reason: 1以上を指定してください。
    NotFound:
      description: 指定したリソースが存在しない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 現在の状態では処理できない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AiUnavailable:
      description: LM Studio未起動、モデル未ロード、または接続不能
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            requestId: e82b0d4c-6531-41ec-9229-38a20e813b4f
            code: AI_UNAVAILABLE
            message: LM Studioに接続できません。Local Serverとモデルを確認してください。
            retryable: true
            details: []
    AiTimeout:
      description: AI処理が制限時間を超過した
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AiInvalidOutput:
      description: AI出力が契約スキーマまたはドメイン規則に適合せず、再試行後も採用できなかった
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsafeUrl:
      description: SSRF対策または許可スキームのルールによりURLを拒否した
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: アップロード上限を超過した
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 未対応のファイル形式
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 予期しないサーバーエラー
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, version, database, ai, timestamp]
      properties:
        status:
          type: string
          enum: [OK, DEGRADED]
        version:
          type: string
          example: 0.1.0
        database:
          $ref: '#/components/schemas/DependencyHealth'
        ai:
          $ref: '#/components/schemas/DependencyHealth'
        timestamp:
          type: string
          format: date-time

    DependencyHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        message:
          type: string

    LmStudioStatus:
      type: object
      required: [status, baseUrl, checkedAt]
      properties:
        status:
          type: string
          enum: [CONNECTED, SERVER_UNREACHABLE, MODEL_NOT_LOADED, INVALID_RESPONSE]
        baseUrl:
          type: string
          format: uri
          example: http://127.0.0.1:1234
        modelId:
          type: string
        contextLength:
          type: integer
          minimum: 1
        checkedAt:
          type: string
          format: date-time
        guidance:
          type: array
          items:
            type: string

    DashboardResponse:
      type: object
      required: [activeSession, overallProfile, recentEsDocuments]
      properties:
        activeSession:
          anyOf:
            - $ref: '#/components/schemas/AnalysisSession'
            - type: 'null'
        overallProfile:
          anyOf:
            - $ref: '#/components/schemas/OverallSelfAnalysisProfile'
            - type: 'null'
        recentEsDocuments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/EsDocumentSummary'

    AnalysisSessionStatus:
      type: string
      enum: [ACTIVE, READY_TO_FINALIZE, COMPLETED, ABANDONED]

    AnalysisSession:
      type: object
      required: [id, title, status, targetAxes, progress, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/AnalysisSessionStatus'
        targetAxes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SelfAnalysisAxis'
        progress:
          $ref: '#/components/schemas/AnalysisProgress'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    AnalysisProgress:
      type: object
      required: [userMessageCount, confirmedExperienceCount, coveredExperienceTypes, missingAxes, canGenerateResult]
      properties:
        userMessageCount:
          type: integer
          minimum: 0
          description: 対象セッションのUSERメッセージ数。
        confirmedExperienceCount:
          type: integer
          minimum: 0
          description: 対象セッション内で本人確認済みの経験数。過去セッション分は含めない。
        canGenerateResult:
          type: boolean
          description: USERメッセージが1件以上ならtrue。確認済み経験数は条件にしない。
        coveredExperienceTypes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExperienceType'
        missingAxes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SelfAnalysisAxis'

    AnalysisSessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisSession'
        nextCursor:
          type: string

    CurrentAnalysisSessionResponse:
      type: object
      required: [session]
      properties:
        session:
          anyOf:
            - $ref: '#/components/schemas/AnalysisSession'
            - type: 'null'

    CreateAnalysisSessionRequest:
      type: object
      required: [startMode]
      properties:
        startMode:
          type: string
          enum: [START_NEW, RESTART_ACTIVE]
          default: START_NEW
          description: RESTART_ACTIVEは進行中セッションをABANDONEDにして新規作成する。
        title:
          type: string
          minLength: 1
          maxLength: 100
          default: 自己分析
        targetAxes:
          type: array
          minItems: 1
          uniqueItems: true
          default: [ENERGY_SOURCE, ACTION_STYLE, SATISFACTION_SOURCE, PREFERRED_ENVIRONMENT]
          items:
            $ref: '#/components/schemas/SelfAnalysisAxis'

    MessageRole:
      type: string
      enum: [USER, ASSISTANT]

    ChatMessage:
      type: object
      required: [id, sessionId, role, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
          minLength: 1
          maxLength: 10000
        questionTarget:
          $ref: '#/components/schemas/QuestionTarget'
        createdAt:
          type: string
          format: date-time

    MessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        nextCursor:
          type: string

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
        clientMessageId:
          type: string
          format: uuid
          description: 二重送信防止用。既送信IDなら同じ結果を返す。

    ChatTurnResponse:
      type: object
      required: [userMessage, assistantMessage, evidenceCandidates, experienceReady, missingAxes, completionIntent]
      properties:
        userMessage:
          $ref: '#/components/schemas/ChatMessage'
        assistantMessage:
          $ref: '#/components/schemas/ChatMessage'
        evidenceCandidates:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceCandidate'
        experienceReady:
          type: boolean
        missingAxes:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SelfAnalysisAxis'
        completionIntent:
          type: string
          enum: [NONE, SUGGESTED]
          description: SUGGESTEDは終了候補。本人確認前にセッション状態を変更しない。

    QuestionTarget:
      type: string
      enum: [ENERGY_SOURCE, ACTION_STYLE, SATISFACTION_SOURCE, PREFERRED_ENVIRONMENT, EXPERIENCE_DETAIL, CONTRADICTION, CONFIRMATION]

    CreateExperienceDraftRequest:
      type: object
      required: [experienceType, messageIds]
      properties:
        experienceType:
          $ref: '#/components/schemas/ExperienceType'
        messageIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid

    ExperienceStatus:
      type: string
      enum: [DRAFT, CONFIRMED]

    ExperienceType:
      type: string
      enum: [ENGAGED, ACHIEVEMENT, CHALLENGE, DRAINING_SUCCESS, TEAM_CONFLICT, OTHER]

    EnergyChange:
      type: integer
      minimum: -2
      maximum: 2
      description: -2=大きく消耗、-1=やや消耗、0=中立/不明、1=やや元気、2=大きく元気

    Experience:
      type: object
      required:
        - id
        - type
        - title
        - situation
        - role
        - actions
        - energyChange
        - environment
        - evidenceQuotes
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sourceSessionId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ExperienceType'
        title:
          type: string
          minLength: 1
          maxLength: 120
        situation:
          type: string
          minLength: 1
          maxLength: 3000
        goal:
          type: string
          maxLength: 2000
        role:
          type: string
          minLength: 1
          maxLength: 1000
        options:
          type: array
          items:
            type: string
            maxLength: 1000
        decision:
          type: string
          maxLength: 2000
        decisionReason:
          type: string
          maxLength: 2000
        actions:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 2000
        result:
          type: string
          maxLength: 3000
        positiveEmotion:
          type: string
          maxLength: 2000
        negativeEmotion:
          type: string
          maxLength: 2000
        energyChange:
          $ref: '#/components/schemas/EnergyChange'
        environment:
          type: array
          items:
            type: string
            maxLength: 500
        evidenceQuotes:
          type: array
          items:
            $ref: '#/components/schemas/MessageQuote'
        status:
          $ref: '#/components/schemas/ExperienceStatus'
        confirmedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateExperienceRequest:
      type: object
      required: [type, title, situation, role, actions, energyChange, environment]
      properties:
        type:
          $ref: '#/components/schemas/ExperienceType'
        title:
          type: string
          minLength: 1
          maxLength: 120
        situation:
          type: string
          minLength: 1
          maxLength: 3000
        goal:
          type: string
          maxLength: 2000
        role:
          type: string
          minLength: 1
          maxLength: 1000
        options:
          type: array
          items:
            type: string
        decision:
          type: string
        decisionReason:
          type: string
        actions:
          type: array
          minItems: 1
          items:
            type: string
        result:
          type: string
        positiveEmotion:
          type: string
        negativeEmotion:
          type: string
        energyChange:
          $ref: '#/components/schemas/EnergyChange'
        environment:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/ExperienceStatus'

    UpdateExperienceRequest:
      type: object
      minProperties: 1
      properties:
        type:
          $ref: '#/components/schemas/ExperienceType'
        title:
          type: string
          minLength: 1
          maxLength: 120
        situation:
          type: string
